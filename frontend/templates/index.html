<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPMorgan Chase - Bank Fraud Desk Operator Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .app-layout {
            grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr) minmax(300px, 1fr);
            overflow-y: auto;
            height: auto;
        }
        .pane-content {
            padding: 1rem;
            overflow-y: auto;
            max-height: 400px;
        }
        select, input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.4rem;
            border-radius: 4px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.4rem; font-size: 0.8rem; }
        pre, code { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; white-space: pre-wrap; overflow-x: auto; background: rgba(0,0,0,0.3); padding: 0.5rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="nav-brand">
            <div class="brand-logo">
                <span class="bank-icon">⚡</span>
                <span class="brand-title">JPMorgan Chase <span>Fraud Desk</span></span>
            </div>
        </div>
        <div class="system-telemetry-bar">
            <div class="telemetry-pill">
                <span>Customer:</span>
                <select id="customer-selector"></select>
            </div>
            <div class="telemetry-pill">
                <span class="status-dot tooltip-host" id="health-dot"></span>
                <span>System Health: <strong id="health-status">Checking...</strong></span>
            </div>
            <div class="telemetry-pill">
                <span>Project: <strong id="session-project">Loading...</strong></span>
            </div>
            <div class="telemetry-pill">
                <span>Glossary: <strong id="session-glossary">Loading...</strong></span>
            </div>
        </div>
    </header>

    <main class="app-layout">
        <!-- 1. Chat Pane -->
        <section class="panel">
            <div class="panel-header">
                <h2>💬 Chat</h2>
            </div>
            <div class="pane-content" style="display:flex; flex-direction:column; max-height:800px;">
                <div id="chat-viewport" style="flex:1; overflow-y:auto; margin-bottom: 1rem; border: 1px solid var(--border-color); padding: 0.5rem; background: var(--bg-card); min-height:300px;"></div>
                <form id="chat-form" style="display:flex; gap:0.5rem;">
                    <input type="text" id="chat-input" placeholder="Ask a question..." style="flex:1;">
                    <button type="submit" class="btn-primary">Send</button>
                </form>
            </div>
        </section>

        <div style="display:flex; flex-direction:column; gap:1rem;">
            <!-- 2. Memory Bank Pane -->
            <section class="panel">
                <div class="panel-header">
                    <h2>🧠 Memory Bank</h2>
                </div>
                <div class="pane-content">
                    <div class="tabs">
                        <button class="btn-secondary" id="btn-memory-topics">Topics</button>
                        <button class="btn-secondary" id="btn-memory-list">List Customer Corpus</button>
                    </div>
                    <form id="memory-search-form" style="display:flex; gap:0.5rem; margin-bottom: 0.5rem;">
                        <input type="text" id="memory-search-input" placeholder="Search query..." style="flex:1;">
                        <button type="submit" class="btn-secondary btn-sm">Retrieve (Sim. Search)</button>
                    </form>
                    <form id="memory-generate-form" style="display:flex; flex-direction: column; gap:0.5rem; margin-bottom: 0.5rem;">
                        <textarea id="memory-generate-input" rows="3" placeholder="Paste transcript text here... (Example: user: help\nmodel: sure)" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color:#fff;"></textarea>
                        <button type="submit" class="btn-secondary btn-sm">Generate from Transcript</button>
                    </form>
                    <div id="memory-output"></div>
                </div>
            </section>

            <!-- 3. Knowledge Catalog Pane -->
            <section class="panel">
                <div class="panel-header">
                    <h2>📚 Knowledge Catalog</h2>
                </div>
                <div class="pane-content">
                    <div class="tabs">
                        <button class="btn-secondary" id="btn-catalog-overview">Overview</button>
                    </div>
                    <form id="catalog-search-form" style="display:flex; gap:0.5rem; margin-bottom: 0.5rem;">
                        <input type="text" id="catalog-search-input" placeholder="Search terms..." style="flex:1;">
                        <button type="submit" class="btn-secondary btn-sm">Search Terms</button>
                    </form>
                    <form id="catalog-auth-form" style="display:flex; gap:0.5rem; margin-bottom: 0.5rem;">
                        <input type="text" id="catalog-auth-table" placeholder="Table" style="width:100px;">
                        <input type="text" id="catalog-auth-column" placeholder="Column (opt)" style="flex:1;">
                        <button type="submit" class="btn-secondary btn-sm">Check Auth</button>
                    </form>
                    <div id="catalog-output"></div>
                </div>
            </section>
        </div>

        <div style="display:flex; flex-direction:column; gap:1rem;">
            <!-- 4. Warehouse Pane -->
            <section class="panel">
                <div class="panel-header">
                    <h2>🏛️ Warehouse</h2>
                </div>
                <div class="pane-content">
                    <div class="tabs">
                        <button class="btn-secondary" id="btn-warehouse-queries">List Queries</button>
                    </div>
                    <form id="warehouse-run-form" style="display:flex; gap:0.5rem; margin-bottom: 0.5rem;">
                        <select id="warehouse-query-id"></select>
                        <button type="submit" class="btn-secondary btn-sm">Run Query</button>
                    </form>
                    <div id="warehouse-output" style="overflow-x:auto;"></div>
                </div>
            </section>

            <!-- 5. Agents Pane -->
            <section class="panel">
                <div class="panel-header">
                    <h2>🤖 Agents Topology</h2>
                </div>
                <div class="pane-content">
                    <div class="tabs">
                        <button class="btn-secondary" id="btn-agents-list">List Architecture</button>
                    </div>
                    <form id="agent-run-form" style="display:flex; gap:0.5rem; margin-bottom: 0.5rem;">
                        <input type="text" id="agent-run-input" placeholder="Question to graph..." style="flex:1;">
                        <button type="submit" class="btn-secondary btn-sm">Run Topology</button>
                    </form>
                    <div id="agents-output"></div>
                </div>
            </section>

            <!-- 6. Evidence / Evaluation Pane -->
            <section class="panel">
                <div class="panel-header">
                    <h2>📊 Evidence & Evaluation</h2>
                </div>
                <div class="pane-content">
                    <div class="tabs">
                        <button class="btn-secondary" id="btn-eval-probes">Probes</button>
                        <button class="btn-secondary" id="btn-eval-reconcile">Reconcile Client</button>
                        <button class="btn-secondary" id="btn-eval-retrieval">Retrieval Eval</button>
                    </div>
                    <form id="eval-policy-form" style="display:flex; gap:0.5rem; margin-bottom: 0.5rem;">
                        <select id="eval-experiment-select">
                            <option value="inclusion">inclusion</option>
                            <option value="topics">topics</option>
                            <option value="scope">scope</option>
                            <option value="consolidation">consolidation</option>
                        </select>
                        <button type="submit" class="btn-secondary btn-sm">Run Write Policy Eval</button>
                    </form>
                    <div id="eval-output"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
